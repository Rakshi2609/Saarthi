<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saarthi — AI-Powered Smart Lending Decision Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
              400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
              800: '#9a3412', 900: '#7c2d12',
            },
            ink: {
              900: '#0c1424', 800: '#15213a', 700: '#1e2a47', 600: '#2d3a5c',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            deva: ['Noto Sans Devanagari', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .deva { font-family: 'Noto Sans Devanagari', system-ui, sans-serif; }
    .gradient-brand { background: linear-gradient(135deg, #0c1424 0%, #1e2a47 60%, #2d3a5c 100%); }
    .gradient-card  { background: linear-gradient(135deg, #fff7ed 0%, #ffffff 100%); }
    .glow { box-shadow: 0 0 40px rgba(249, 115, 22, 0.25); }
    .ring-brand { box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.18); }
    .bar { transition: width 0.6s cubic-bezier(.16,1,.3,1); }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .live-dot { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    #map { height: 320px; border-radius: 12px; z-index: 0; }
    .shap-bar { height: 18px; border-radius: 4px; }
    .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-ink-900 antialiased">

  <!-- ============== Top Nav ============== -->
  <header class="gradient-brand text-white sticky top-0 z-50 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center h-16">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-lg glow">सा</div>
        <div>
          <div class="text-lg font-bold tracking-tight">Saarthi</div>
          <div class="text-[10px] uppercase tracking-widest text-brand-300">AI Lending Co-Pilot · TVS Credit</div>
        </div>
      </div>
      <nav class="ml-10 flex items-center gap-1 text-sm">
        <a href="#/apply"      data-route="apply"     class="nav-link px-3 py-2 rounded-md hover:bg-white/10">Apply</a>
        <a href="#/assistant"  data-route="assistant" class="nav-link px-3 py-2 rounded-md hover:bg-white/10">Saarthi Assistant</a>
        <a href="#/dashboard"  data-route="dashboard" class="nav-link px-3 py-2 rounded-md hover:bg-white/10">Underwriter Dashboard</a>
      </nav>
      <div class="ml-auto flex items-center gap-4 text-xs">
        <span class="flex items-center gap-1.5 text-emerald-300"><span class="w-2 h-2 rounded-full bg-emerald-400 live-dot"></span>Live · Demo Data</span>
        <span class="text-slate-300 hidden sm:inline">EPIC 8 · Round 3</span>
      </div>
    </div>
  </header>

  <!-- ============== Page container ============== -->
  <main id="page" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6"></main>

  <!-- ============== Footer ============== -->
  <footer class="border-t border-slate-200 mt-16 py-6 text-center text-xs text-slate-500">
    Saarthi · Built for TVS Credit EPIC 8 hackathon · Synthetic data — all scores, names, and decisions are illustrative.
  </footer>

  <!-- ============== Leaflet ============== -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ============== App ============== -->
  <script src="app.js"></script>
</body>
</html>
